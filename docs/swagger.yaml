  /api/v1/catalog/classes/{class_id}/enrollments:
    post:
      consumes:
      - application/json
      description: 'Creates a pending group enrollment and generates a billing invoice.
        Direct private checkout answers 422 with code `private_schedule_request_required`;
        submit a schedule request instead. The tenant is resolved from the selected
        class. Retrying with the same Idempotency-Key returns the same enrollment.
        A 409 with `code` `duplicate_enrollment` means the student already has a pending
        or active enrollment in this class (including a concurrent request that won
        the race); a 409 without `code` is a full schedule or an Idempotency-Key reused
        with a different request. A 422 with `code` `platform_fee_exceeds_gross` means
        billing refused the invoice because the platform fee exceeds the payment amount:
        the attempt holds no seat and does not block a new attempt, and a replay with
        the same Idempotency-Key answers the same 422. A dropped or completed enrollment
        does not block a new one.'
      parameters:
      - description: Class UUID
        in: path
        name: class_id
        required: true
        type: string
      - description: Unique request key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Enrollment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.PublicEnrollmentRequest'
      produces:
      - application/json
      responses:
