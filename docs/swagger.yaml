  /api/v1/tenants/{tenant_id}/enrollments:
    post:
      consumes:
      - application/json
      description: 'A tenant-member token must carry `tenant_id` equal to the path
        and hold `enrollment:create`; a parent token skips the permission check and
        is enrolled through the public-enrollment flow (known errors answer 422).
        Direct private checkout answers 422 with `code` `private_schedule_request_required`;
        submit a schedule request instead. A 409 with `code` `duplicate_enrollment`
        means the student already has a pending or active enrollment in this class;
        a 409 without `code` is an Idempotency-Key reused with a different request.
        A 422 with `code` `platform_fee_exceeds_gross` means billing refused the invoice
        because the platform fee exceeds the payment amount: the attempt holds no
        seat, and a replay with the same Idempotency-Key answers the same 422.'
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Unique request key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Enrollment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.EnrollStudentRequest'
