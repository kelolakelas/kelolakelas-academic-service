      - BearerAuth: []
      summary: Enroll a student in a class
      tags:
      - Enrollments
      x-permission:
        parent_tokens: skipped
        permission: enrollment:create
  /health:
    get:
      description: Answers 200 while the process serves HTTP; it checks no dependency.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - Health
  /internal/enrollments/{id}/activate:
    put:
      consumes:
      - application/json
      description: Internal service-to-service endpoint for payment-confirmed enrollment
        activation.
      parameters:
      - description: Enrollment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.EnrollmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
      security:
      - InternalServiceCredential: []
      summary: Activate enrollment after confirmed payment
      tags:
      - Enrollments
  /internal/enrollments/{id}/release:
    put:
      consumes:
      - application/json
      description: Internal service-to-service endpoint that transitions a pending
        enrollment to `dropped` so its schedule seat becomes available again. The
        transition is idempotent and never revokes an active enrollment.
      parameters:
      - description: Enrollment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.EnrollmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-academic-service_internal_domain.ErrorResponse'
      security:
      - InternalServiceCredential: []
      summary: Release the seat of an enrollment whose payment failed or expired
      tags:
      - Enrollments
  /ready:
    get:
      description: Pings the database and the identity gRPC health service within
        one second. `status` and each `components` entry are `healthy` or `unavailable`;
        any unavailable component answers 503.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness probe
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: User JWT as `Bearer <token>`. Tenant-member tokens are also checked
      against the permission named in each operation's `x-permission`.
    in: header
    name: Authorization
    type: apiKey
  InternalServiceCredential:
    description: Shared service-to-service credential; accepted only on `/internal`
      routes.
    in: header
    name: X-Internal-Service-Credential
    type: apiKey
swagger: "2.0"
